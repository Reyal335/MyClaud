<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mya Mascot states</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#0B132B}
a{color:#5BC0BE}a:hover{color:#F2F4F8}
</style>
</head>
<body>
<div style="width: 1280px; height: 420px; box-sizing: border-box; padding: 32px 40px; background: #0B132B; color: #F2F4F8; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 14px">MASCOT STATES</h1>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px">

<div style="padding: 16px; background: #1C2541; border: 4px solid #3A506B; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<div style="position: relative; width: 128px; height: 128px"><img src="mascot.png" alt="Mascot, idle" style="display: block; width: 128px; height: 128px; object-fit: cover; image-rendering: pixelated"></div>
<div style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #A9B6C6">IDLE</div>
<div>No agent is active.</div>
</div>

<div style="padding: 16px; background: #1C2541; border: 4px solid #3A506B; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<div style="position: relative; width: 128px; height: 128px"><img src="mascot.png" alt="Mascot, thinking" style="display: block; width: 128px; height: 128px; object-fit: cover; image-rendering: pixelated"><span aria-hidden="true" style="position: absolute; top: -12px; right: -20px; padding: 8px; background: #F2F4F8; color: #0B132B; border: 4px solid #0B132B; font-family: 'Press Start 2P', monospace; font-size: 10px">...</span></div>
<div style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #5BC0BE">THINKING</div>
<div>Waiting on the model's next step.</div>
</div>

<div style="padding: 16px; background: #1C2541; border: 4px solid #3A506B; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<div style="position: relative; width: 128px; height: 128px"><img src="mascot.png" alt="Mascot, talking" style="display: block; width: 128px; height: 128px; object-fit: cover; image-rendering: pixelated"><span aria-hidden="true" style="position: absolute; top: -12px; right: -20px; padding: 8px; background: #F2F4F8; color: #0B132B; border: 4px solid #0B132B; font-family: 'Press Start 2P', monospace; font-size: 10px">Aa</span></div>
<div style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #5BC0BE">TALKING</div>
<div>Reply is typing out. Plays the talk loop.</div>
</div>

<div style="padding: 16px; background: #1C2541; border: 4px solid #3A506B; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<div style="position: relative; width: 128px; height: 128px"><img src="mascot.png" alt="Mascot, working" style="display: block; width: 128px; height: 128px; object-fit: cover; image-rendering: pixelated"><span aria-hidden="true" style="position: absolute; top: -12px; right: -20px; padding: 8px; background: #0B132B; color: #6FCF7F; border: 4px solid #6FCF7F; font-family: 'Press Start 2P', monospace; font-size: 10px">&gt;_</span></div>
<div style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #6FCF7F">WORKING</div>
<div>Reading files or running a command.</div>
</div>

<div style="padding: 16px; background: #1C2541; border: 4px solid #3A506B; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<div style="position: relative; width: 128px; height: 128px"><img src="mascot.png" alt="Mascot, asking permission" style="display: block; width: 128px; height: 128px; object-fit: cover; image-rendering: pixelated"><span aria-hidden="true" style="position: absolute; top: -12px; right: -20px; padding: 8px 10px; background: #F2B84B; color: #0B132B; border: 4px solid #0B132B; font-family: 'Press Start 2P', monospace; font-size: 10px">?</span></div>
<div style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #F2B84B">ASKING</div>
<div>Needs your approval to continue.</div>
</div>

</div>
</div>
</body>
</html>
